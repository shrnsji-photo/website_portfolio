<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHERON — Photography</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background: #0b0b0b;
    color: #f2f2f2;
    overflow-x: hidden;
}

/* ---------- BACKGROUND ---------- */
.bg {
    position: fixed;
    inset: 0;
    background: url("imagebackground/bg.jpg") center/cover no-repeat;
    filter: blur(35px) brightness(0.5);
    transform: scale(1.2);
    z-index: -2;
}

/* ---------- HERO ---------- */
.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 1rem;
}

.hero-box {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    padding: 3rem;
    max-width: 900px;
    width: 100%;
    border-radius: 16px;
}

.hero h1 {
    font-size: clamp(2.5rem, 6vw, 4rem);
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
}

.hero p {
    font-size: 1.1rem;
    opacity: 0.9;
    max-width: 700px;
}

/* ---------- GALLERY ---------- */
.gallery {
    padding: 4rem 1rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
}

.gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.25s ease;
}

.gallery img:hover {
    transform: scale(1.03);
}

/* ---------- LIGHTBOX ---------- */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.lightbox img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
}

/* ---------- FOOTER ---------- */
footer {
    text-align: center;
    padding: 2rem;
    opacity: 0.5;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<div class="bg"></div>

<section class="hero">
    <div class="hero-box">
        <h1>SHERON</h1>
        <p>
            Photography without filters, without compromise.  
            Light, timing, intent — nothing else.
        </p>
    </div>
</section>

<section class="gallery" id="gallery"></section>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
</div>

<footer>
    © Sheron — All images remain unmodified.
</footer>

<script>
const USER = "shrnsji-photo";
const REPO = "website_portfolio";
const PATH = "images";

const gallery = document.getElementById("gallery");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}`)
.then(r => r.json())
.then(files => {
    files.forEach(f => {
        if (!f.name.match(/\.(jpg|jpeg|png|webp)$/i)) return;

        const img = document.createElement("img");
        img.src = f.download_url;
        img.loading = "lazy";

        img.onclick = () => {
            lightboxImg.src = img.src;
            lightbox.style.display = "flex";
        };

        gallery.appendChild(img);
    });
});

lightbox.onclick = () => {
    lightbox.style.display = "none";
    lightboxImg.src = "";
};
</script>

</body>
</html>
